<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y Sweet — אישור הזמנה</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Assistant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;direction:rtl;}
:root{--gold:#C9A84C;--gold2:#E8C97A;--gold3:#F5E6C0;--gold4:#8B6914;--dark:#1A1208;--bg:#FAFAF8;--text:#1C1C1C;--muted:#6B6560;--border:rgba(0,0,0,0.1);--rad:14px;--radsm:8px;--serif:'Playfair Display',Georgia,serif;--body:'Assistant',sans-serif;}
body{font-family:var(--body);background:var(--bg);color:var(--text);}
.app{max-width:680px;margin:0 auto;padding-bottom:40px;}
.header{background:linear-gradient(160deg,#1A1208,#2C1F08);border-radius:0 0 var(--rad) var(--rad);margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,0.25);}
.hi{display:flex;align-items:center;gap:14px;padding:16px 20px;}
.hbrand{font-family:var(--serif);font-size:20px;font-style:italic;color:var(--gold2);}
.gold-line{height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);}
.card{background:#fff;border:0.5px solid var(--border);border-radius:var(--rad);padding:16px 20px;margin:0 12px 14px;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.stitle{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold4);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.stitle::after{content:'';flex:1;height:0.5px;background:linear-gradient(90deg,var(--gold),transparent);}
.confirm-header{background:linear-gradient(135deg,#1A1208,#2C1F08);border-radius:var(--rad);padding:20px;margin:0 12px 14px;text-align:center;}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:14px;}
.item-row:last-child{border-bottom:none;}
.item-name{font-weight:500;}
.item-price{font-weight:600;color:var(--gold4);}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;font-size:18px;font-weight:700;font-family:var(--serif);color:var(--gold4);border-top:2px solid var(--gold);}
.svc-tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:20px;background:var(--gold3);color:var(--gold4);margin:3px;}
.confirm-btn{display:block;width:calc(100% - 24px);margin:0 12px;padding:16px;background:linear-gradient(135deg,#2E7D32,#4CAF50);color:#fff;border:none;border-radius:var(--rad);font-size:16px;font-weight:700;font-family:var(--body);cursor:pointer;text-align:center;}
.confirmed-box{background:linear-gradient(135deg,#1A3A1A,#2E5A2E);border-radius:var(--rad);padding:20px;margin:0 12px 14px;text-align:center;color:#fff;}
.loading{text-align:center;padding:3rem;color:var(--muted);font-family:var(--serif);font-style:italic;}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="hi">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <defs>
        <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E8C97A"/><stop offset="50%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#8B6914"/>
        </linearGradient>
        <radialGradient id="bg" cx="45%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#FFFDF5"/><stop offset="100%" stop-color="#F5E6C0"/>
        </radialGradient>
        <linearGradient id="yg" x1="0%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="#8B6914"/><stop offset="50%" stop-color="#C9A84C"/><stop offset="100%" stop-color="#7A5C10"/>
        </linearGradient>
      </defs>
      <circle cx="28" cy="28" r="27" fill="url(#rg)"/>
      <circle cx="28" cy="28" r="23" fill="url(#bg)"/>
      <text x="28" y="37" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" font-style="italic" fill="url(#yg)">Y</text>
    </svg>
    <div>
      <div class="hbrand">Y Sweet מהדרין</div>
      <div style="font-size:11px;color:var(--gold);">אישור הזמנה</div>
    </div>
  </div>
  <div class="gold-line"></div>
</div>

<div id="content"><div class="loading">טוען פרטי הזמנה...</div></div>
</div>

<script>
const SUPABASE_URL = 'https://xbjyzcdxfsjnqjqjwsxs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SSlTKx-prnpBZ7KA56Fxdg_QOfNfr-z';

async function sbReq(method, table, body=null, filter='') {
  const url = `${SUPABASE_URL}/rest/v1/${table}${filter}`;
  const res = await fetch(url, {
    method,
    headers: {'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body: body ? JSON.stringify(body) : null
  });
  if (!res.ok) throw new Error(await res.text());
  const t = await res.text();
  return t ? JSON.parse(t) : [];
}

const params = new URLSearchParams(window.location.search);
const orderId = params.get('id');

const SERVICES_DEF = [
  {id:'buffet',icon:'🍽️',label:'עריכת בופה'},
  {id:'bar',icon:'🍸',label:'עריכת בר'},
  {id:'coffee',icon:'☕',label:'עמדת קפה'},
  {id:'tables',icon:'🌸',label:'עריכת שולחנות'},
  {id:'package',icon:'🎁',label:'מארז'},
];

async function init() {
  if (!orderId) {
    document.getElementById('content').innerHTML = '<div class="loading">קישור לא תקין</div>';
    return;
  }
  try {
    const [ordRows, menuRows] = await Promise.all([
      sbReq('GET','orders',null,`?id=eq.${orderId}`),
      sbReq('GET','menu')
    ]);
    if (!ordRows.length) { document.getElementById('content').innerHTML='<div class="loading">הזמנה לא נמצאה</div>'; return; }
    ord = ordRows[0].data;
    const M = menuRows.map(r=>r.data).filter(Boolean);
    renderConfirm(ord, M);
  } catch(e) {
    document.getElementById('content').innerHTML='<div class="loading">שגיאה בטעינה</div>';
  }
}

function renderConfirm(ord, M) {
  let tot = 0;
  const itemRows = (ord.items||[]).map(oi => {
    const m = M.find(m=>m.id===oi.menuId); if(!m)return'';
    let lbl=m.name;
    const v=oi.variantId&&m.variants?m.variants.find(v=>v.id===oi.variantId):null;
    if(v) lbl+=` (${v.name})`;
    const s=m.price*oi.qty; tot+=s;
    return `<div class="item-row">
      <div><div class="item-name">${lbl}</div><div style="font-size:11px;color:var(--muted);">× ${oi.qty} ${m.unit}</div></div>
      <div class="item-price">₪${s.toLocaleString()}</div>
    </div>`;
  }).join('');

  const svcTags = SERVICES_DEF.filter(s=>ord.services?.[s.id]?.active).map(s=>{
    const p=ord.services[s.id].price||0; tot+=p;
    return `<span class="svc-tag">${s.icon} ${s.label} ₪${p}</span>`;
  }).join('');

  const delPrice = parseFloat(ord.delivery?.price)||0; tot+=delPrice;
  const delNote = ord.delivery?.note||'';

  const isConfirmed = ord.status === 'confirmed' || ord.clientConfirmed;

  document.getElementById('content').innerHTML = `
    <div class="confirm-header">
      <div style="font-size:13px;color:var(--gold3);margin-bottom:4px;">ההזמנה נערכה על ידי Y Sweet</div>
      <div style="font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gold2);">${ord.clientName}</div>
      ${ord.eventDate?`<div style="font-size:13px;color:var(--gold3);margin-top:4px;">📅 ${ord.eventDate} ${ord.eventTime?'⏰ '+ord.eventTime:''}</div>`:''}
      ${ord.eventLocation?`<div style="font-size:12px;color:var(--gold3);">📍 ${ord.eventLocation}</div>`:''}
    </div>

    <div class="card">
      <div class="stitle">פרטי ההזמנה</div>
      ${itemRows}
      ${svcTags?`<div style="margin-top:10px;">${svcTags}</div>`:''}
      ${delPrice>0?`<div class="item-row"><div class="item-name">🚚 משלוח${delNote?' — '+delNote:''}</div><div class="item-price">₪${delPrice}</div></div>`:''}
      ${(delPrice===0||ord.delivery?.price==='0')?`<div class="item-row"><div class="item-name">🚚 משלוח${delNote?' — '+delNote:''}</div><div style="color:#4CAF50;font-weight:600;">חינם</div></div>`:''}
      <div class="total-row"><span>סה"כ לתשלום</span><span>₪${tot.toLocaleString()}</span></div>
    </div>

    ${ord.eventNotes?`<div class="card"><div style="font-size:13px;color:var(--muted);">📝 ${ord.eventNotes}</div></div>`:''}

    ${ord.pendingQuestions&&ord.pendingQuestions.length?`
    <div style="background:#FFF8E7;border:1.5px solid var(--gold);border-radius:var(--radsm);padding:14px;margin:0 0 12px;">
      <div style="font-weight:600;color:var(--gold4);margin-bottom:8px;">❓ פרטים לבירור — נא לענות:</div>
      ${ord.pendingQuestions.map((q,i)=>`
        <div style="margin-bottom:10px;">
          <div style="font-size:13px;font-weight:500;">❓ ${q}</div>
          <input type="text" id="ans_${i}" style="width:100%;padding:7px;border:0.5px solid var(--border);border-radius:6px;font-size:13px;margin-top:4px;" placeholder="תשובתך...">
        </div>`).join('')}
      <button onclick="sendAnswers()" style="width:100%;padding:10px;background:linear-gradient(135deg,#C9A84C,#E8C97A);border:none;border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--body);">שלח תשובות ✓</button>
    </div>`:''}

    ${!isConfirmed?`<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;padding:8px;background:var(--gold3);border-radius:var(--radsm);">⏳ ממתינה לאישורך</div>`:''}
    ${isConfirmed
      ? `<div class="confirmed-box">
          <div style="font-size:40px;margin-bottom:10px;">✅</div>
          <div style="font-family:var(--serif);font-style:italic;font-size:20px;margin-bottom:6px;">ההזמנה מאושרת!</div>
          <div style="font-size:13px;opacity:0.8;">תודה! אנו מצפים לשרת אתכם.</div>
        </div>`
      : `<button class="confirm-btn" onclick="confirmOrder()">✅ אני מאשר/ת את ההזמנה</button>
         <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px;padding:0 12px;">לחיצה על הכפתור מהווה אישור סופי להזמנה</div>`
    }

    <div style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted);">
      Y Sweet מהדרין | יעל כהן | 050-4940803
    </div>
  `;
}

async function confirmOrder() {
  const btn = document.querySelector('.confirm-btn');
  if(btn) { btn.textContent='שולח אישור...'; btn.disabled=true; }
  try {
    const ordRows = await sbReq('GET','orders',null,`?id=eq.${orderId}`);
    if(ordRows.length){
      const ord=ordRows[0].data;
      ord.status='confirmed';
      ord.clientConfirmed=true;
      ord.confirmedAt=new Date().toISOString();
      await sbReq('POST','orders',{id:String(orderId),data:ord});
    }
    // הצג אישור
    document.querySelector('.confirm-btn').replaceWith(Object.assign(document.createElement('div'),{
      className:'confirmed-box',
      innerHTML:'<div style="font-size:40px;margin-bottom:10px;">✅</div><div style="font-family:var(--serif);font-style:italic;font-size:20px;margin-bottom:6px;">ההזמנה מאושרת!</div><div style="font-size:13px;opacity:0.8;">תודה! אנו מצפים לשרת אתכם.<br>Y Sweet מהדרין | 050-4940803</div>'
    }));
    const note=document.querySelector('[style*="לחיצה"]');
    if(note)note.remove();
  } catch(e) { alert('שגיאה. נסה שוב.'); if(btn){btn.textContent='✅ אני מאשר/ת את ההזמנה';btn.disabled=false;} }
}

let ord = null;
async function sendAnswers(){
  const questions=ord.pendingQuestions||[];
  const answers=questions.map((q,i)=>({question:q,answer:document.getElementById('ans_'+i)?.value||''}));
  ord.clientAnswers=answers;
  ord.pendingQuestions=[];
  await sbReq('POST','orders',{id:String(orderId),data:ord});
  alert('תשובותיך נשלחו! תודה.');
  // עדכן תצוגה בלי reload
  document.querySelectorAll('[onclick="sendAnswers()"]').forEach(b=>b.disabled=true);
  document.querySelectorAll('#content input').forEach(i=>i.disabled=true);
  document.querySelector('[onclick="sendAnswers()"]') && (document.querySelector('[onclick="sendAnswers()"]').textContent='✅ נשלח!');
}
init();
</script>
</body>
</html>
